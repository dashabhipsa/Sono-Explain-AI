services:
  api:
    build: .
    command: uvicorn app.backend.main:app --host 0.0.0.0 --port 8000
    environment:
      SONOEXPLAIN_CHECKPOINT: checkpoints/E3/best_model_e3.pth
      SONOEXPLAIN_DEVICE: cpu
      SONOEXPLAIN_CORS_ORIGINS: http://localhost:8501
    ports: ["8000:8000"]
  frontend:
    build: .
    command: streamlit run app/frontend/Home.py --server.address 0.0.0.0 --server.port 8501
    environment:
      SONOEXPLAIN_API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
